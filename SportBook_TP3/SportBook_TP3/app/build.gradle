// Configuration du module "app" (Groovy)
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.sportbook'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.sportbook"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Code écrit en Java pur
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Aligne les versions des bibliothèques internes d'AndroidX
    // (corrige l'erreur « Duplicate class kotlin... »). Ce n'est PAS du code Kotlin.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

// Sécurité supplémentaire contre « Duplicate class kotlin... » :
// on force les anciennes bibliothèques jdk7/jdk8 (1.6.21) à la même version que kotlin-stdlib.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
tasks.register('prepareKotlinBuildScriptModel') { }
